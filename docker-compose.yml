services:
  db:
    container_name: postgres_database
    image: postgres:15-alpine
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_PASSWORD=${DB_PASS}
